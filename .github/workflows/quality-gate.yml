name: Quality gate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: storex_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/storex_test
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/storex_test
      NODE_ENV: production
      TZ: Asia/Tehran
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Committed diff whitespace check
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          else
            git show --format= --check HEAD
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --include=dev
      - name: Compare dependency audit against main without force upgrades
        run: |
          mkdir -p verification-output
          node --input-type=module <<'JS'
          import {execFileSync,spawnSync} from 'node:child_process';
          import {mkdtempSync,writeFileSync,rmSync} from 'node:fs';
          import {tmpdir} from 'node:os';
          import path from 'node:path';
          const temporary=mkdtempSync(path.join(tmpdir(),'main-audit-'));
          for(const file of ['package.json','package-lock.json'])
            writeFileSync(path.join(temporary,file),execFileSync('git',['show','origin/main:'+file]));
          const audits={};
          for(const [name,cwd] of [['main',temporary],['current',process.cwd()]]) {
            const result=spawnSync('npm',['audit','--package-lock-only','--json'],{cwd,encoding:'utf8'});
            const parsed=JSON.parse(result.stdout);
            if(parsed.error || !parsed.metadata?.vulnerabilities) throw new Error('AUDIT_UNAVAILABLE');
            writeFileSync('verification-output/npm-audit-'+name+'.json',JSON.stringify(parsed,null,2));
            audits[name]=parsed.metadata.vulnerabilities;
          }
          rmSync(temporary,{recursive:true,force:true});
          console.log(JSON.stringify({dependencyAudit:audits}));
          if(audits.current.total!==0) throw new Error('DEPENDENCY_AUDIT_REGRESSION');
          JS
      - run: npx prisma validate && npx prisma generate
      - run: npx prisma migrate deploy
      - run: python3 -m pip install -r scripts/requirements-calendar.txt
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npx playwright install --with-deps chromium
      - run: node --import tsx scripts/import-calendar-base-year.ts --year=1405
      - run: node --import tsx scripts/import-official-calendar-events-1405.ts --year=1405
      - run: npx tsc --noEmit
      - run: node --import tsx --test --test-concurrency=1 tests/*.test.ts
      - run: npm run build
      - run: node --import tsx scripts/check-web-regression.ts
        env:
          RUN_BROWSER_TESTS: "true"
      - name: Rendered synthetic PDF and browser review images
        run: node --import tsx scripts/emit-browser-review-images.ts
      - name: Existing calendar smoke checks
        run: |
          for check in service overrides attendance-policy dashboard-integration weekly-plan reports; do
            node --import tsx "scripts/check-calendar-${check}.ts"
          done
      - run: git diff --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-output
          path: verification-output
          if-no-files-found: ignore
          retention-days: 14
